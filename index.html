    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--paper);
      color: var(--ink);
      font-family: var(--body);
      font-size: 1.125rem;
      line-height: 1.55;
      overflow-x: hidden;
      -webkit-font-smoothing: antialiased;
    }
    body.locked { overflow: hidden; }
    img { display: block; max-width: 100%; }
    button, input, textarea { font: inherit; color: inherit; }
    :focus-visible { outline: 2px solid var(--red); outline-offset: 4px; }

    /* ================= Age gate ================= */
    .gate {
      position: fixed; inset: 0; z-index: 100;
      display: flex; align-items: center; justify-content: center;
      padding: 16px;
      background: rgba(255, 255, 255, 0.4);
    }
    .gate[hidden] { display: none; }
    .gate-box {
      width: 100%; max-width: 280px;
      background: var(--paper);
      border: 1px solid #e3e1dc;
      border-top: 3px solid var(--red);
      box-shadow: 0 8px 30px rgba(28, 34, 48, 0.14);
      padding: 20px 20px 18px;
      text-align: center;
    }
    .gate-box h2 { font-family: var(--stamp); font-weight: 800; font-size: 1.1rem; margin-bottom: 14px; }
    .gate-actions { display: flex; gap: 10px; }
    .gate-btn {
      flex: 1; padding: 8px 0; cursor: pointer;
      font-weight: 700; font-size: .95rem; letter-spacing: .08em;
      border: 1px solid var(--red);
    }
    .gate-yes { background: var(--red); color: #fff; }
    .gate-yes:hover { background: var(--red-dark); }
    .gate-no { background: transparent; border-color: #b9b6ae; }
    .gate-no:hover { border-color: var(--ink); }
    .gate-denied { color: var(--red); font-size: .85rem; margin-top: 12px; }

    /* ================= Intro (stamp splash) ================= */
    .intro {
      position: fixed; inset: 0; z-index: 50;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 22px;
      background: var(--paper);
      transition: background-color .6s ease .35s;
    }
    body.entered .intro { background-color: transparent; pointer-events: none; }
    body.landed .intro { display: none; }
    .stamp-btn {
      background: none; border: 0; padding: 0; cursor: pointer;
      border-radius: 50%;
      width: min(78vw, 420px);
      will-change: transform;
      -webkit-tap-highlight-color: transparent;
    }
    .stamp-btn img { width: 100%; height: auto; transform: rotate(-4deg); }
    @keyframes rock {
      0%, 100% { transform: rotate(-4deg); }
      25%      { transform: rotate(-11deg); }
      75%      { transform: rotate(3deg); }
    }
    @media (hover: hover) {
      body:not(.entered) .stamp-btn:hover img { animation: rock .9s ease-in-out infinite; }
    }
    .intro-hint {
      font-weight: 600; font-size: .95rem; letter-spacing: .06em; color: var(--muted);
      transition: opacity .3s ease;
    }
    .intro-hint .click { display: none; }
    @media (hover: hover) { .intro-hint .tap { display: none; } .intro-hint .click { display: inline; } }
    body.entered .intro-hint { opacity: 0; }

    /* ================= Header ================= */
    .site-header {
      position: fixed; top: 0; left: 0; right: 0; z-index: 40;
      height: calc(var(--header-h) + env(safe-area-inset-top));
      padding: env(safe-area-inset-top) max(16px, env(safe-area-inset-right)) 0 max(16px, env(safe-area-inset-left));
      display: grid; grid-template-columns: 44px 1fr 44px; column-gap: 12px; align-items: center;
      background: rgba(255, 255, 255, 0.97);
      opacity: 0; transition: opacity .5s ease .25s;
    }
    .site-header::after {
      content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 7px;
      border-top: 2px dashed var(--thread);
      border-bottom: 2px solid var(--denim);
    }
    body.entered .site-header { opacity: 1; }
    .home-logo { width: 44px; height: 44px; display: block; border-radius: 50%; }
    .home-logo img { width: 44px; height: 44px; transform: rotate(-4deg); opacity: 0; }
    body.landed .home-logo img { opacity: 1; }
    .wordmark {
      justify-self: start;
      font-family: var(--stamp); font-weight: 800;
      font-size: clamp(1.05rem, 5vw, 1.6rem); line-height: 1; white-space: nowrap;
      letter-spacing: .01em; color: var(--red); text-decoration: none;
      -webkit-mask-image: var(--grunge); mask-image: var(--grunge);
      -webkit-mask-size: 6.5em; mask-size: 6.5em;
    }
    .menu-btn {
      justify-self: end; width: 44px; height: 44px; cursor: pointer;
      background: none; border: 0; display: grid; place-content: center; gap: 6px;
    }
    .menu-btn span { display: block; width: 26px; height: 3px; background: var(--red); transition: transform .3s ease, opacity .2s ease; }
    body.menu-open .menu-btn span:nth-child(1) { transform: translateY(9px) rotate(45deg); }
    body.menu-open .menu-btn span:nth-child(2) { opacity: 0; }
    body.menu-open .menu-btn span:nth-child(3) { transform: translateY(-9px) rotate(-45deg); }

    /* ================= Dropdown menu ================= */
    .dropdown {
      position: fixed; z-index: 45;
      top: calc(var(--header-h) + env(safe-area-inset-top) + 6px);
      right: max(16px, env(safe-area-inset-right));
      width: max-content;
      background: var(--paper);
      border: 2px solid var(--ink);
      box-shadow: 6px 6px 0 var(--red);
      padding: 6px;
      opacity: 0; transform: translateY(-8px); visibility: hidden;
      transition: opacity .18s ease, transform .18s ease, visibility 0s linear .18s;
    }
    body.menu-open .dropdown { opacity: 1; transform: none; visibility: visible; transition: opacity .18s ease, transform .18s ease; }
    .dropdown ul { list-style: none; }
    .dropdown li + li { border-top: 2px dashed var(--thread); }
    .dropdown a {
      display: block; padding: 10px 16px;
      font-family: var(--body); font-weight: 600; font-size: 1.05rem; letter-spacing: .1em;
      text-transform: uppercase; color: var(--ink); text-decoration: none;
    }
    .dropdown a:hover, .dropdown a[aria-current="page"] { color: var(--red); }

    /* ================= Hero ================= */
    .site { opacity: 0; transition: opacity .7s ease .3s; }
    body.entered .site { opacity: 1; }
    .hero {
      min-height: 100vh; min-height: 100svh;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 18px; text-align: center;
      padding: calc(var(--header-h) + 32px) 0 48px;
      transition: min-height .7s var(--ease), padding .7s var(--ease);
    }
    body.has-view .hero { min-height: 0; padding: calc(var(--header-h) + clamp(28px, 6vw, 56px)) 0 clamp(24px, 4vw, 40px); }
    .hero h1 {
      font-family: var(--stamp); font-weight: 800;
      font-size: min(calc((100vw - 40px) / 13.8), 5rem); line-height: 1; white-space: nowrap;
      letter-spacing: -.005em; text-transform: uppercase; color: var(--red);
      -webkit-mask-image: var(--grunge); mask-image: var(--grunge);
      -webkit-mask-size: 5.4em; mask-size: 5.4em;
    }
    .hero-sub {
      font-size: min(calc((100vw - 40px) / 29), 1.2rem); font-weight: 500; line-height: 1.45;
      white-space: nowrap; color: var(--ink);
    }

    /* ================= Content panels ================= */
    .panel {
      width: min(100% - 32px, 760px); margin: 0 auto;
      padding: 0 0 calc(64px + env(safe-area-inset-bottom));
    }
    .panel[hidden] { display: none; }
    .panel.show { animation: rise .55s var(--ease) both .15s; }
    @keyframes rise { from { opacity: 0; transform: translateY(18px); } to { opacity: 1; transform: none; } }
    .panel h2 {
      font-family: var(--stamp); font-weight: 800; text-transform: uppercase;
      font-size: 1.15rem; letter-spacing: .04em; color: var(--ink);
      text-align: center; margin-bottom: 22px;
      display: flex; align-items: center; gap: 14px;
    }
    .panel h2::before, .panel h2::after { content: ""; flex: 1; border-top: 2px dashed var(--thread); }

    /* Brands: logo slots (swap the text for <img> logos later) */
    .brands { list-style: none; display: flex; flex-wrap: wrap; justify-content: center; gap: clamp(12px, 3vw, 24px); }
    .brand {
      position: relative;
      width: clamp(150px, 42vw, 240px);
      height: clamp(84px, 23vw, 120px);
      display: flex; align-items: center; justify-content: center;
      border: 2px solid var(--ink);
      padding: 12px 14px;
      background: var(--paper);
      transition: transform .2s ease, box-shadow .2s ease;
    }
    .brand:hover { transform: translate(-3px, -3px); box-shadow: 6px 6px 0 var(--red); }
    .brand-name {
      font-family: var(--stamp); font-weight: 800; text-transform: uppercase;
      font-size: clamp(1.05rem, 4.2vw, 1.9rem); line-height: 1.05; color: var(--red);
      -webkit-mask-image: var(--distress); mask-image: var(--distress);
      -webkit-mask-size: 200px; mask-size: 200px;
    }
    .badge {
      position: absolute; top: -11px; right: -10px;
      background: var(--red); color: #fff;
      font-weight: 700; font-size: .72rem; letter-spacing: .1em; text-transform: uppercase;
      padding: 3px 8px; line-height: 1.3;
      transform: rotate(4deg);
    }
    .brand img { width: auto; height: auto; max-width: 100%; max-height: 100%; }

    /* Contact form */
    .contact-form { display: grid; gap: 14px; max-width: 460px; margin: 0 auto; }
    .field { display: grid; gap: 6px; }
    .field label { font-weight: 700; font-size: 1rem; }
    .field .opt { font-weight: 500; color: var(--muted); }
    .field input, .field textarea {
      width: 100%; padding: 9px 12px;
      border: 2px solid var(--ink); border-radius: 0; background: var(--paper);
      font-size: 1.05rem; /* 16px+ keeps iOS from zooming on focus */
    }
    .field textarea { min-height: 120px; resize: vertical; }
    .field input:focus, .field textarea:focus { outline: none; border-color: var(--red); box-shadow: 3px 3px 0 var(--red); }
    .hp { position: absolute; left: -9999px; width: 1px; height: 1px; overflow: hidden; }
    .form-actions { display: flex; flex-wrap: wrap; align-items: center; gap: 16px; }
    .send-btn {
      cursor: pointer; border: 2px solid var(--red); background: var(--red); color: #fff;
      font-family: var(--stamp); font-weight: 800; text-transform: uppercase; letter-spacing: .04em;
      font-size: 1rem; padding: 13px 26px;
      transition: background .15s ease;
    }
    .send-btn:hover { background: var(--red-dark); }
    .send-btn:disabled { opacity: .6; cursor: wait; }
    .form-status { font-weight: 600; }
    .form-status.ok { color: var(--denim); }
    .form-status.err { color: var(--red); }

    @media (prefers-reduced-motion: reduce) {
      .stamp-btn img { animation: none !important; }
      .hero, .dropdown, .brand { transition: none; }
      .panel.show { animation: none; }
    }
  </style>
</head>

  <script>
    (function () {
      var body = document.body;
      var reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

      /* ---- Age gate ---- */
      var KEY = "sanctioned_age_ok";
      var gate = document.getElementById("ageGate");
      var ok = false;
      try { ok = localStorage.getItem(KEY) === "1"; } catch (e) {}
      if (ok) gate.hidden = true;
      document.getElementById("gateYes").addEventListener("click", function () {
        try { localStorage.setItem(KEY, "1"); } catch (e) {}
        gate.hidden = true;
        document.getElementById("stampBtn").focus();
      });
      document.getElementById("gateNo").addEventListener("click", function () {
        document.getElementById("gateDenied").hidden = false;
      });

      /* ---- Intro: spin the stamp into the header ---- */
      var stampBtn = document.getElementById("stampBtn");
      var stampImg = stampBtn.querySelector("img");
      var homeLogo = document.getElementById("homeLogo");
      var entered = false;

      function land() {
        body.classList.add("landed");
        body.classList.remove("locked");
        showView(location.hash.replace("#", ""));
      }

      function enter() {
        if (entered || !gate.hidden) return;
        entered = true;
        body.classList.add("entered");
        window.scrollTo(0, 0);
        if (!stampBtn.animate) { land(); return; }

        var from = stampBtn.getBoundingClientRect();
        var to = homeLogo.getBoundingClientRect();
        var dx = (to.left + to.width / 2) - (from.left + from.width / 2);
        var dy = (to.top + to.height / 2) - (from.top + from.height / 2);
        var s = to.width / from.width;
        var ease = "cubic-bezier(.65,0,.25,1)";

        stampImg.style.animation = "none";
        stampImg.animate(
          [{ transform: "rotate(-4deg)" }, { transform: "rotate(716deg)" }],
          { duration: 1200, easing: ease, fill: "forwards" }
        );
        stampBtn.animate(
          [
            { transform: "translate(0, 0) scale(1)" },
            { transform: "translate(0, 0) scale(1.06)", offset: 0.18 },
            { transform: "translate(" + dx + "px," + dy + "px) scale(" + s + ")" }
          ],
          { duration: 1200, easing: ease, fill: "forwards" }
        ).onfinish = land;
      }
      stampBtn.addEventListener("click", enter);

      /* ---- Views: home / brands / contact ---- */
      var views = ["brands", "contact"];
      function showView(name) {
        var active = views.indexOf(name) > -1 ? name : "";
        body.classList.toggle("has-view", !!active);
        views.forEach(function (v) {
          var panel = document.getElementById("panel-" + v);
          var on = v === active;
          panel.hidden = !on;
          panel.classList.toggle("show", on);
        });
        document.querySelectorAll(".dropdown a").forEach(function (a) {
          if (a.dataset.view === active) a.setAttribute("aria-current", "page");
          else a.removeAttribute("aria-current");
        });
        window.scrollTo({ top: 0, behavior: reduce ? "auto" : "smooth" });
      }
      /* Update the address bar when the browser allows it (some previews block this) */
      function setUrl(name) {
        try { history.pushState({ view: name }, "", name ? "#" + name : location.pathname + location.search); } catch (err) {}
      }
      window.addEventListener("popstate", function () {
        if (body.classList.contains("landed")) showView(location.hash.replace("#", ""));
      });

      function goHome(e) {
        e.preventDefault();
        closeMenu();
        setUrl("");
        showView("");
      }
      document.querySelector(".wordmark").addEventListener("click", goHome);
      homeLogo.addEventListener("click", function (e) {
        goHome(e);
        var img = homeLogo.querySelector("img");
        if (img.animate) {
          img.animate([{ transform: "rotate(-4deg)" }, { transform: "rotate(356deg)" }],
            { duration: 700, easing: "cubic-bezier(.3,0,.2,1)" });
        }
      });

      /* ---- Dropdown ---- */
      var menuBtn = document.getElementById("menuBtn");
      var dropdown = document.getElementById("dropdown");
      function closeMenu() {
        body.classList.remove("menu-open");
        menuBtn.setAttribute("aria-expanded", "false");
        menuBtn.setAttribute("aria-label", "Open menu");
      }
      menuBtn.addEventListener("click", function (e) {
        e.stopPropagation();
        var open = body.classList.toggle("menu-open");
        menuBtn.setAttribute("aria-expanded", String(open));
        menuBtn.setAttribute("aria-label", open ? "Close menu" : "Open menu");
        if (open) dropdown.querySelector("a").focus({ preventScroll: true });
      });
      dropdown.querySelectorAll("a").forEach(function (a) {
        a.addEventListener("click", function (e) {
          e.preventDefault();
          closeMenu();
          setUrl(a.dataset.view);
          showView(a.dataset.view);
        });
      });
      document.addEventListener("click", function (e) {
        if (body.classList.contains("menu-open") && !dropdown.contains(e.target)) closeMenu();
      });
      document.addEventListener("keydown", function (e) {
        if (e.key === "Escape" && body.classList.contains("menu-open")) { closeMenu(); menuBtn.focus(); }
      });

      /* ---- Contact form → email via FormSubmit ---- */
      var FORM_ENDPOINT = "https://formsubmit.co/ajax/aa084c9af77398ab26785fed16fed16faabb9";
      var form = document.getElementById("contactForm");
      var status = document.getElementById("formStatus");
      var sendBtn = document.getElementById("sendBtn");
      form.addEventListener("submit", function (e) {
        e.preventDefault();
        status.className = "form-status"; status.textContent = "";
        var name = form.elements["name"].value.trim(), email = form.email.value.trim(), msg = form.message.value.trim();
        if (!name || !msg || !form.email.checkValidity() || !email) {
          status.className = "form-status err";
          status.textContent = !name ? "Add your name." : (!email || !form.email.checkValidity()) ? "Add a valid email address." : "Add a message.";
          return;
        }
        if (form._honey.value) return; /* bot */
        sendBtn.disabled = true; sendBtn.textContent = "Sending…";
        fetch(FORM_ENDPOINT, {
          method: "POST",
          headers: { "Content-Type": "application/json", "Accept": "application/json" },
          body: JSON.stringify({
            name: name, email: email, phone: form.phone.value.trim(), message: msg,
            _subject: "New message from sanctionedspirits.com",
            _replyto: email, _template: "table", _captcha: "false"
          })
        }).then(function (r) { return r.json().then(function (d) { return { ok: r.ok, d: d }; }); })
          .then(function (res) {
            if (!res.ok || String(res.d.success) !== "true") throw new Error("send failed");
            form.reset();
            status.className = "form-status ok";
            status.textContent = "Message sent. We'll be in touch.";
          })
          .catch(function () {
            status.className = "form-status err";
            status.textContent = "Your message didn't send. Check your connection and try again.";
          })
          .then(function () { sendBtn.disabled = false; sendBtn.textContent = "Send message"; });
      });
    })();
  </script>
</body>
</html>
